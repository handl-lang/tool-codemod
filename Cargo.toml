[package]
name = "hnl-engine-codemod"
version = "0.1.0"
edition = "2024"
description = "Declarative codemod spec model (codemod.yaml): targets, rules, and the plan/apply/revert lifecycle data (proposal P-002, plan PL-004)."
license = "MIT"
repository = "https://github.com/handl-lang/engine-codemod"
homepage = "https://handl-lang.github.io/docs/engine-codemod/"
documentation = "https://handl-lang.github.io/docs/engine-codemod/reference/"
readme = "README.md"
keywords = ["handl", "engine", "codemod", "rewrite", "language-as-data"]
categories = ["compilers", "development-tools"]
# Git-install only: https://github.com/handl-lang/engine-codemod (no crates.io).
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
